<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stETH 脱锚监控</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: #f7f7f8;
      color: #1f2937;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #111827;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #6b7280;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
      transition: all .2s;
    }
    .dot.connected { background: #16a34a; box-shadow: 0 0 8px rgba(22,163,74,.45); }
    .dot.connecting { background: #d97706; }
    .dot.error { background: #dc2626; box-shadow: 0 0 8px rgba(220,38,38,.5); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      transition: background .4s;
    }
    .card-title {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .big {
      font-size: 42px;
      font-weight: 400;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      color: #111827;
    }
    .deviation-ok { color: #16a34a; }
    .deviation-warn { color: #d97706; }
    .deviation-danger { color: #dc2626; }
    .meta {
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
      display: grid;
      gap: 6px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .meta-row .k { color: #9ca3af; }
    .meta-row .v {
      font-variant-numeric: tabular-nums;
      color: #374151;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .loading { color: #d1d5db; }
    .footer {
      margin-top: 40px;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
    }
    code {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #6b7280;
    }
    .pulse {
      animation: pulse .8s ease-out;
    }
    @keyframes pulse {
      0%   { background: #ecfdf5; }
      100% { background: #ffffff; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>stETH / ETH 脱锚监控</h1>
      <div class="status">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">初始化...</span>
      </div>
    </header>

    <div class="grid">
      <div class="card" id="card-price">
        <div class="card-title">stETH / ETH 偏离</div>
        <div class="big loading" id="deviation">—</div>
        <div class="meta">
          <div class="meta-row"><span class="k">市场价</span><span class="v" id="price">—</span></div>
          <div class="meta-row"><span class="k">锚定价</span><span class="v">1.000000</span></div>
          <div class="meta-row"><span class="k">Round ID</span><span class="v" id="round-id">—</span></div>
          <div class="meta-row"><span class="k">链上更新于</span><span class="v" id="price-age">—</span></div>
        </div>
      </div>

      <div class="card" id="card-queue">
        <div class="card-title">Lido 退出队列</div>
        <div class="big loading" id="queue-eth">—</div>
        <div class="meta">
          <div class="meta-row"><span class="k">预计等待</span><span class="v" id="queue-days">—</span></div>
          <div class="meta-row"><span class="k">数据源</span><span class="v" id="queue-source">—</span></div>
          <div class="meta-row"><span class="k">最新请求 ID</span><span class="v" id="last-req">—</span></div>
          <div class="meta-row"><span class="k">已最终化 ID</span><span class="v" id="last-fin">—</span></div>
          <div class="meta-row"><span class="k">排队请求数</span><span class="v" id="pending-count">—</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">网络状态</div>
        <div class="big" id="block-num">—</div>
        <div class="meta">
          <div class="meta-row"><span class="k">最新区块</span><span class="v" id="block-time">—</span></div>
          <div class="meta-row"><span class="k">RPC</span><span class="v">publicnode ws</span></div>
          <div class="meta-row"><span class="k">事件推送</span><span class="v" id="ws-events">0</span></div>
          <div class="meta-row"><span class="k">页面运行</span><span class="v" id="uptime">0s</span></div>
        </div>
      </div>
    </div>

    <div class="footer">
      Chainlink <code>0x86392dC1...Cf5c52812</code> · Lido WithdrawalQueue <code>0x889edC2e...412F9B1</code><br>
      预计等待天数来自 Lido 官方 API（<code>wq-api.lido.fi</code>）
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
